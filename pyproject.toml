[project]
name = "adk-swarm"
version = "0.1.0"
description = "ADK Agent Swarm with declarative YAML config and runtime agent persistence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.15.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
